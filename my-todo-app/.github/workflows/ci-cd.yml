name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ main ]  # Runs the pipeline every time you push code to main
  pull_request:
    branches: [ main ]  # Runs when someone tries to merge code into main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the code from GitHub onto the runner server
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies (clean installation from package.json)
      - name: Install Project Dependencies
        run: npm ci

      # Step 4: Run a build check to verify compilation passes
      - name: Build Application
        run: npm run build --if-present

      # Step 5: Run automated test scripts (if configured)
      - name: Run Tests
        run: npm test --if-present
