name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ main ]   # Runs CI + deploy every time you push to main
  pull_request:
    branches: [ main ]   # Runs CI only, when someone opens a pull request to main

jobs:
  # ================= STAGE 1: CONTINUOUS INTEGRATION =================
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-todo-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Project Dependencies
        run: npm ci

      - name: Check Syntax
        run: |
          node --check server.js
          node --check public/app.js

  # ================= STAGE 2: CONTINUOUS DEPLOYMENT =================
  deploy:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > key.pem
          chmod 600 key.pem
          ssh-keygen -lf key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd ~/todo-repo
            git pull origin main
            cd my-todo-app
            npm ci --omit=dev
            pm2 restart todo-app
          EOF